<!DOCTYPE html>
<html lang="no">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Bokka-rute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <?!= include('RouteStyle'); ?>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">🌾 Bokka-rute</h1>
      <div class="days" role="tablist" aria-label="Velg dag">
        <button class="day" data-day="Lørdag" role="tab">Lørdag</button>
        <button class="day" data-day="Søndag" role="tab">Søndag</button>
      </div>
    </header>

    <section class="summary frame" id="summary" hidden>
      <div class="progress">
        <div class="progress__bar"><span id="progressFill"></span></div>
        <div class="progress__text"><strong id="doneCount">0</strong> av <strong id="totalCount">0</strong> levert</div>
      </div>
      <div class="chips">
        <span class="chip chip--bread">🍞 <b id="breadTotal">0</b> brød</span>
        <span class="chip chip--bun">🥐 <b id="bunTotal">0</b> boller</span>
        <span class="chip chip--walk">🚶 <b id="walkText">–</b></span>
      </div>
    </section>

    <div id="map" class="map frame" hidden></div>

    <div id="status" class="status">Laster …</div>

    <section id="stops" class="stops" aria-live="polite"></section>

    <details class="parent">
      <summary>👩‍🍳 Foreldre</summary>
      <div class="parent__body">
        <button id="regenBtn" class="btn">Generer rute på nytt</button>
        <button id="locateBtn" class="btn btn--ghost">Vis hvor jeg er</button>
        <p class="parent__note">
          Rekkefølgen skrives til «Bestillinger» når du genererer. Er noe allerede levert,
          spør appen før den stokker om ruten.
        </p>
      </div>
    </details>
  </div>

  <div id="celebrate" class="celebrate" hidden>
    <div class="celebrate__card frame">
      <div class="celebrate__emoji">🎉🌾🍞</div>
      <h2>Hele ruten er levert!</h2>
      <p id="celebrateText">Bra jobba, Bokka-bud!</p>
      <button class="btn" id="celebrateClose">Ferdig</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <?!= include('RouteClient'); ?>
</body>
</html>
