<style>
  :root {
    --parchment: #f6ecd6;
    --card: #efe1c4;
    --edge: #e6d4b0;
    --forest: #2c4a32;
    --forest-soft: #4a6549;
    --bread-outline: #4a3527;
    --gold: #cf9a3e;
    --gold-light: #e8c07d;
    --sage: #8f9d6a;
    --pink: #e0968a;
    --pink-soft: #eec7bd;
    --shadow: rgba(74, 53, 39, .18);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--parchment);
    color: var(--forest);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.4;
  }

  body {
    background-image:
      radial-gradient(circle at 12% 18%, rgba(207, 154, 62, .07) 0 3px, transparent 3px),
      radial-gradient(circle at 78% 62%, rgba(143, 157, 106, .09) 0 4px, transparent 4px),
      radial-gradient(circle at 45% 88%, rgba(224, 150, 138, .07) 0 3px, transparent 3px);
    background-size: 180px 180px, 220px 220px, 260px 260px;
  }

  .app { max-width: 540px; margin: 0 auto; padding: 14px 14px 40px; }

  /* ---------- storybook frame ---------- */
  .frame {
    background: var(--card);
    border: 2.5px solid var(--bread-outline);
    border-radius: 18px 20px 19px 21px;
    box-shadow: 0 0 0 4px var(--parchment), 0 6px 0 0 var(--shadow);
  }

  /* ---------- top bar ---------- */
  .topbar { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand {
    font-family: "Baloo 2", system-ui, sans-serif;
    font-weight: 700; font-size: 1.9rem; margin: 6px 0 0;
    color: var(--forest); letter-spacing: .3px;
  }
  .days { display: flex; gap: 8px; }
  .day {
    font-family: "Baloo 2", system-ui, sans-serif;
    font-weight: 600; font-size: 1rem;
    padding: 8px 20px; border-radius: 999px;
    border: 2.5px solid var(--bread-outline);
    background: var(--parchment); color: var(--forest-soft);
    cursor: pointer; transition: transform .08s ease;
  }
  .day:active { transform: scale(.96); }
  .day.is-active {
    background: linear-gradient(160deg, #f8edcf, #eedfb2);
    color: var(--forest);
    box-shadow: inset 0 -3px 0 rgba(74, 53, 39, .12);
  }

  /* ---------- summary ---------- */
  .summary { padding: 14px 16px; margin-bottom: 14px; }
  .progress { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .progress__bar {
    flex: 1; height: 16px; border-radius: 999px;
    background: var(--parchment);
    border: 2px solid var(--bread-outline); overflow: hidden;
  }
  .progress__bar span {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--gold-light), var(--gold));
    border-radius: 999px; transition: width .4s cubic-bezier(.2, .9, .3, 1.2);
  }
  .progress__text { font-family: "Baloo 2", system-ui, sans-serif; white-space: nowrap; }
  .progress__text strong { color: var(--forest); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: .92rem; padding: 5px 12px; border-radius: 999px;
    background: var(--parchment); border: 2px solid var(--edge);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip b { font-family: "Baloo 2", system-ui, sans-serif; }
  .chip--bread { border-color: var(--gold-light); }
  .chip--bun { border-color: var(--pink-soft); }
  .chip--walk { border-color: var(--sage); }

  /* ---------- map ---------- */
  .map {
    height: 42vh; min-height: 240px; margin-bottom: 16px;
    border-radius: 18px; overflow: hidden;
    padding: 0;
  }
  .leaflet-container { font: inherit; background: #dfe6d6; }

  /* map pins */
  .pin {
    width: 34px; height: 34px; border-radius: 50% 50% 50% 6px;
    transform: rotate(-45deg);
    background: linear-gradient(160deg, var(--gold-light), var(--gold));
    border: 2.5px solid var(--bread-outline);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 5px rgba(0, 0, 0, .3);
  }
  .pin > * { transform: rotate(45deg); }
  .pin {
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 700;
    color: var(--forest); font-size: 1rem;
  }
  .pin--next { background: linear-gradient(160deg, #bfe0a6, var(--sage)); animation: bob 1.1s ease-in-out infinite; }
  .pin--done { background: #d8cdb5; color: #8a7d63; }
  @keyframes bob { 0%, 100% { margin-top: 0; } 50% { margin-top: -5px; } }

  /* ---------- stops ---------- */
  .stops { display: flex; flex-direction: column; gap: 12px; }
  .stop {
    position: relative; padding: 14px 14px 14px 64px;
    background: var(--card);
    border: 2.5px solid var(--bread-outline);
    border-radius: 16px 18px 16px 18px;
    box-shadow: 0 4px 0 0 var(--shadow);
    transition: opacity .25s ease, transform .1s ease;
  }
  .stop__num {
    position: absolute; left: 12px; top: 12px;
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(160deg, #f8edcf, #eedfb2);
    border: 2.5px solid var(--bread-outline);
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 700; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center; color: var(--forest);
  }
  .stop__addr { font-family: "Baloo 2", system-ui, sans-serif; font-weight: 600; font-size: 1.12rem; }
  .stop__order { color: var(--forest-soft); margin: 2px 0 8px; }
  .stop__time {
    display: inline-block; font-size: .85rem; padding: 3px 10px; border-radius: 999px;
    background: var(--parchment); border: 2px solid var(--edge); color: var(--forest-soft);
  }
  .stop__btn {
    margin-top: 12px; width: 100%; padding: 13px; cursor: pointer;
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 700; font-size: 1.15rem;
    color: #fff; background: linear-gradient(160deg, #3c7a4a, var(--forest));
    border: 2.5px solid var(--bread-outline); border-radius: 12px;
    box-shadow: 0 4px 0 0 rgba(44, 74, 50, .5); transition: transform .08s ease;
  }
  .stop__btn:active { transform: translateY(3px); box-shadow: 0 1px 0 0 rgba(44, 74, 50, .5); }

  .stop__done {
    margin-top: 12px; width: 100%; padding: 11px; cursor: pointer;
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 700; font-size: 1.05rem;
    color: var(--forest); background: #dbe8cf;
    border: 2.5px dashed var(--forest-soft); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .stop__undo { font-family: "Caveat", cursive; font-weight: 700; font-size: 1.05rem; color: var(--pink); }

  .stop.is-done { opacity: .62; }
  .stop.is-done .stop__num { background: #d8cdb5; color: #8a7d63; }

  .stop.is-next { border-color: var(--forest); box-shadow: 0 0 0 3px var(--sage), 0 4px 0 0 var(--shadow); }
  .stop__ribbon {
    position: absolute; top: -12px; right: 14px;
    font-family: "Caveat", cursive; font-weight: 700; font-size: 1.1rem;
    background: var(--pink); color: #fff; padding: 2px 14px; border-radius: 999px;
    border: 2px solid var(--bread-outline); transform: rotate(3deg);
  }

  /* ---------- status / empty ---------- */
  .status {
    text-align: center; padding: 18px 10px; color: var(--forest-soft);
    font-family: "Baloo 2", system-ui, sans-serif;
  }
  .status:empty { display: none; }

  /* ---------- parent area ---------- */
  .parent { margin-top: 22px; border-top: 2px dashed var(--edge); padding-top: 12px; }
  .parent > summary {
    cursor: pointer; font-family: "Baloo 2", system-ui, sans-serif; font-weight: 600;
    color: var(--forest-soft); list-style: none; padding: 6px 2px;
  }
  .parent > summary::-webkit-details-marker { display: none; }
  .parent__body { display: flex; flex-direction: column; gap: 10px; padding: 10px 2px; }
  .parent__note { font-size: .85rem; color: var(--forest-soft); margin: 4px 0 0; }
  .btn {
    padding: 12px; cursor: pointer;
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 700; font-size: 1rem;
    border-radius: 12px; border: 2.5px solid var(--bread-outline);
    background: linear-gradient(160deg, #f8edcf, #eedfb2); color: var(--forest);
  }
  .btn--ghost { background: var(--parchment); }
  .btn:active { transform: translateY(2px); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--forest); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-family: "Baloo 2", system-ui, sans-serif; box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 900;
  }
  .toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- celebration ---------- */
  .celebrate {
    position: fixed; inset: 0; background: rgba(44, 74, 50, .55);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 1000;
  }
  .celebrate[hidden] { display: none; }
  .celebrate__card { padding: 26px 22px; text-align: center; max-width: 360px; animation: pop .4s cubic-bezier(.2, .9, .3, 1.4); }
  .celebrate__emoji { font-size: 2.6rem; }
  .celebrate__card h2 { font-family: "Baloo 2", system-ui, sans-serif; margin: 8px 0; color: var(--forest); }
  .celebrate__card p { color: var(--forest-soft); margin: 0 0 16px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .confetti {
    position: fixed; top: -20px; font-size: 1.4rem; z-index: 1001; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(360deg); opacity: .2; }
  }

  [hidden] { display: none !important; }
</style>
